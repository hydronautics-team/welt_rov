stingray_core_control_node:
  ros__parameters:
    rate_hz: 70.0
    # /control/data contract in automatic mode:
    # linear.x/y are body-frame offsets [m], linear.z is depth offset [m]
    # (positive down), all relative to the current pose;
    # angular.xyz are absolute roll/pitch/yaw setpoints [deg].
    # In manual and assisted modes /control/data contains direct axis impacts.
    # Assisted mode adds them to enabled controllers; loop_flags bit 6 selects
    # whether the hold point follows the vehicle while an impact is applied.
    topic_control_data: /control/data
    topic_control_mode: /control/mode
    topic_loop_flags: /control/loop_flags
    topic_imu: /core/sensors/imu
    topic_odometry: /core/state/odometry
    thrusters:
    - sway_front
    - depth_back_right
    - sway_back
    - depth_front_right
    - surge_upper_right
    - surge_upper_left
    - depth_back_left
    - depth_front_left
    - surge_lower_left
    - surge_lower_right
    axes:
    - surge
    - sway
    - heave
    - roll
    - pitch
    - yaw
    yaw:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    pitch:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    roll:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    surge:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    sway:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    heave:
    - K_p
    - K_1
    - K_2
    - K_i
    - I_min
    - I_max
    - out_sat
    - ap_K
    - ap_T
    flag_setup_feedback_speed: false
    dvl_timeout_sec: 0.5
    dvl_position_timeout_sec: 0.5
    command_timeout_sec: 0.5
    manual_impact_deadband: 0.001
    debug_publish: true
    use_sim_time: false
